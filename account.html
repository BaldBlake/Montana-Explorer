<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Montana Explorer</title>
<link rel="stylesheet" href="css/shared.css">
</head>
<body data-page="account">

<nav class="site-nav">
  <a href="index.html" class="brand"><span class="emoji">🏔</span>Montana Explorer</a>
  <div class="links">
    <a href="index.html" data-link="home">Home</a>
    <a href="map.html" data-link="map">Map</a>
    <a href="about.html" data-link="about">About</a>
    <span id="nav-auth-slot"></span>
  </div>
</nav>

<main class="page">
  <div id="signed-out" class="form-card hidden">
    <h2>You're not signed in</h2>
    <p class="muted">Log in to see your account and saved pins.</p>
    <div class="form-actions">
      <a class="btn primary" href="login.html">Log in</a>
      <a class="btn secondary" href="login.html?mode=signup">Sign up</a>
    </div>
  </div>

  <div id="signed-in" class="hidden">
    <div class="form-card">
      <h2>Your account</h2>
      <div class="form-row">
        <label>Email</label>
        <div id="acct-email" class="muted"></div>
      </div>
      <div class="form-row">
        <label for="acct-username">Username</label>
        <input type="text" id="acct-username" maxlength="40">
      </div>
      <div class="form-actions">
        <button type="button" class="btn primary" id="save-username">Update username</button>
      </div>
      <div id="username-msg" class="form-msg hidden"></div>
    </div>

    <div class="form-card">
      <h2>Change password</h2>
      <div class="form-row">
        <label for="new-pw">New password</label>
        <input type="password" id="new-pw" autocomplete="new-password" minlength="6">
      </div>
      <div class="form-row">
        <label for="new-pw2">Confirm new password</label>
        <input type="password" id="new-pw2" autocomplete="new-password" minlength="6">
      </div>
      <div class="form-actions">
        <button type="button" class="btn primary" id="save-password">Update password</button>
      </div>
      <div id="password-msg" class="form-msg hidden"></div>
    </div>

    <div class="form-card">
      <h2>Your saved pins</h2>
      <div id="pins-empty" class="muted hidden">You haven't saved any pins yet. Open the map and right-click anywhere to drop one.</div>
      <table class="data-table hidden" id="pins-table">
        <thead><tr><th>Label</th><th>Coordinates</th><th>Saved</th><th></th></tr></thead>
        <tbody id="pins-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="site-footer">
  <a href="index.html">Home</a> · <a href="map.html">Map</a> · <a href="about.html">About</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  function showMsg(id, kind, text) {
    const el = $(id); el.className = 'form-msg ' + kind; el.textContent = text;
  }
  function clearMsg(id) { const el = $(id); el.className = 'form-msg hidden'; el.textContent = ''; }
  function fmt(d) { return new Date(d).toLocaleDateString(); }

  async function renderPins() {
    const pins = await window.MTAuth.pins.list();
    const tbl = $('pins-table'), empty = $('pins-empty'), body = $('pins-tbody');
    body.innerHTML = '';
    if (!pins.length) { tbl.classList.add('hidden'); empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden'); tbl.classList.remove('hidden');
    pins.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${(p.label || '<span class="muted">— no label —</span>')}</td>
        <td>${(+p.lat).toFixed(4)}, ${(+p.lng).toFixed(4)}</td>
        <td>${fmt(p.created_at)}</td>
        <td>
          <button class="action-btn" data-act="open" data-lat="${p.lat}" data-lng="${p.lng}">Open on map</button>
          <button class="action-btn danger" data-act="del" data-id="${p.id}">Delete</button>
        </td>`;
      body.appendChild(tr);
    });
    body.onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'del') {
        if (!confirm('Delete this pin?')) return;
        try { await window.MTAuth.pins.remove(b.dataset.id); await renderPins(); } catch (err) { alert(err.message); }
      } else if (b.dataset.act === 'open') {
        location.href = `map.html?lat=${b.dataset.lat}&lng=${b.dataset.lng}`;
      }
    };
  }

  async function init() {
    await window.MTAuth.ready;
    const session = window.MTAuth.getSession();
    if (!session) {
      $('signed-out').classList.remove('hidden');
      return;
    }
    $('signed-in').classList.remove('hidden');
    $('acct-email').textContent = session.user.email;
    const profile = window.MTAuth.getProfile();
    $('acct-username').value = (profile && profile.username) || '';

    $('save-username').addEventListener('click', async () => {
      const v = $('acct-username').value.trim();
      if (v.length < 2) return showMsg('username-msg', 'error', 'Username must be at least 2 characters.');
      try {
        await window.MTAuth.updateMyUsername(v);
        showMsg('username-msg', 'success', 'Username updated.');
      } catch (e) { showMsg('username-msg', 'error', e.message); }
    });

    $('save-password').addEventListener('click', async () => {
      clearMsg('password-msg');
      const a = $('new-pw').value, b = $('new-pw2').value;
      if (a.length < 6) return showMsg('password-msg', 'error', 'Password must be at least 6 characters.');
      if (a !== b)     return showMsg('password-msg', 'error', 'Passwords do not match.');
      try {
        await window.MTAuth.updateMyPassword(a);
        $('new-pw').value = ''; $('new-pw2').value = '';
        showMsg('password-msg', 'success', 'Password updated.');
      } catch (e) { showMsg('password-msg', 'error', e.message); }
    });

    await renderPins();
  }
  init();
})();
</script>
</body>
</html>
